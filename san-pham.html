<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tất Cả Mẫu Hoa - Bloom Elegance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FFFDF9] text-slate-700 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-rose-100/60 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-rose-100 flex items-center justify-center text-rose-500">
                    <i class="fa-solid fa-spa text-lg"></i>
                </div>
                <div>
                    <span class="font-serif-title font-bold text-xl tracking-wide text-slate-800">Bloom Elegance</span>
                </div>
            </a>
            <a href="index.html" class="text-xs font-semibold text-rose-500 hover:underline flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
            </a>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-6xl mx-auto px-4 py-10 flex-1 w-full">
        <h1 class="font-serif-title text-3xl font-bold text-slate-800 text-center mb-8">Tất Cả Mẫu Hoa Tươi</h1>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dán hoặc bổ sung tất cả mẫu hoa của bạn ở đây -->
            <p class="text-center text-slate-400 col-span-full py-12">Danh sách toàn bộ sản phẩm hoa sẽ nằm ở đây...</p>
        </div>
    </main>

    <footer class="bg-white border-t border-rose-100/60 py-6 text-center text-xs text-slate-400">
        <p>© 2026 Bloom Elegance Shop.</p>
    </footer>
</body>
</html>
